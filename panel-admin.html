<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Admin — AL AUTO</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --ad-navy: #0f172a;
        --ad-blue: #2563eb;
        --ad-bg: #f1f5f9;
        --ad-card: #ffffff;
        --ad-line: #e2e8f0;
        --ad-ink: #1e293b;
        --ad-muted: #64748b;
        --ad-radius: 12px;
      }
      * { box-sizing: border-box; }
      body { margin:0; font-family:"Poppins",system-ui,sans-serif; background:var(--ad-bg); color:var(--ad-ink); min-height:100vh; display:flex; flex-direction:column; }
      .admin-topbar { background:var(--ad-navy); color:#fff; padding:14px 24px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; box-shadow:0 2px 12px rgba(0,0,0,0.25); }
      .admin-brand { display:flex; align-items:center; gap:12px; font-weight:700; font-size:18px; letter-spacing:0.04em; }
      .admin-brand img { height:30px; background:#fff; border-radius:6px; padding:4px 6px; }
      .admin-brand small { display:block; font-size:10px; font-weight:500; color:#94a3b8; letter-spacing:0.16em; text-transform:uppercase; }
      .admin-topbar .btn-logout { background:#ef4444; color:#fff; border:none; padding:8px 18px; border-radius:8px; font-weight:600; cursor:pointer; font-family:inherit; }
      .admin-topbar .btn-logout:hover { background:#dc2626; }
      .admin-main { flex:1; padding:24px; max-width:1200px; width:100%; margin:0 auto; }
      .admin-card { background:var(--ad-card); border:1px solid var(--ad-line); border-radius:var(--ad-radius); padding:20px; box-shadow:0 4px 14px rgba(15,23,42,0.06); margin-bottom:20px; }
      .admin-card h2 { margin:0 0 4px; font-size:20px; color:var(--ad-navy); }
      .admin-card .sub { color:var(--ad-muted); font-size:14px; margin-bottom:16px; }
      .admin-tabs { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
      .admin-tabs button { padding:8px 18px; border:1px solid var(--ad-line); background:#fff; border-radius:8px; font-weight:600; cursor:pointer; font-family:inherit; color:var(--ad-ink); }
      .admin-tabs button.active { background:var(--ad-blue); color:#fff; border-color:var(--ad-blue); }
      .admin-section { display:none; }
      .admin-section.active { display:block; }
      .admin-table { width:100%; border-collapse:collapse; font-size:13.5px; }
      .admin-table th, .admin-table td { border:1px solid var(--ad-line); padding:8px 10px; text-align:left; vertical-align:top; }
      .admin-table th { background:#f8fafc; color:var(--ad-navy); font-weight:600; }
      .admin-table tr:hover td { background:#f8fafc; }
      .admin-actions { display:flex; gap:6px; flex-wrap:wrap; }
      .btn-xs { padding:5px 11px; font-size:12px; border-radius:6px; border:none; cursor:pointer; font-family:inherit; font-weight:600; }
      .btn-primary { background:var(--ad-blue); color:#fff; }
      .btn-danger { background:#ef4444; color:#fff; }
      .btn-outline { background:#fff; color:var(--ad-ink); border:1px solid var(--ad-line); }
      .status-badge { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11.5px; font-weight:600; }
      .status-pending { background:#fef3c7; color:#92400e; }
      .status-approved { background:#dcfce7; color:#166534; }
      .status-rejected { background:#fee2e2; color:#991b1b; }
      .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,0.6); display:none; align-items:center; justify-content:center; z-index:1500; padding:16px; }
      .modal-overlay.open { display:flex; }
      .modal-card { background:#fff; border-radius:var(--ad-radius); padding:24px; max-width:520px; width:100%; max-height:90vh; overflow:auto; box-shadow:0 20px 50px rgba(0,0,0,0.3); }
      .modal-card h3 { margin:0 0 12px; color:var(--ad-navy); }
      .form-group { margin-bottom:12px; }
      .form-group label { display:block; font-size:13px; font-weight:600; color:var(--ad-navy); margin-bottom:4px; }
      .form-group input, .form-group select { width:100%; padding:9px 11px; border:1px solid var(--ad-line); border-radius:8px; font-family:inherit; font-size:14px; }
      .access-denied { text-align:center; padding:60px 20px; color:var(--ad-muted); }
      .access-denied h2 { color:#ef4444; }
    </style>
</head>
<body>
    <div class="admin-topbar">
        <div class="admin-brand">
            <img src="assets/img/logo.png" alt="Logo">
            <div>AL AUTO<small>Admin Console</small></div>
        </div>
        <button class="btn-logout" id="admin-logout" type="button">Logout</button>
    </div>

    <main class="admin-main" id="admin-main">
        <div class="admin-card">
            <h2>Panel Admin</h2>
            <p class="sub" id="admin-status">Memuat...</p>

            <div class="admin-tabs">
                <button class="active" id="tab-users" type="button">Manajemen User</button>
                <button id="tab-attendance" type="button">Data Absensi</button>
                <button id="tab-stats" type="button">Statistik &amp; Export</button>
            </div>

            <div class="admin-section active" id="section-users">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; flex-wrap:wrap; gap:8px;">
                    <h3 style="margin:0; color:var(--ad-navy);">Daftar User</h3>
                    <button class="btn-xs btn-primary" id="btn-add-user" type="button" style="padding:8px 16px; font-size:13px;">+ Tambah User</button>
                </div>
                <div style="overflow:auto;">
                    <table class="admin-table">
                        <thead><tr><th>Nama</th><th>Email</th><th>HP</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead>
                        <tbody id="users-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div class="admin-section" id="section-attendance">
                <h3 style="margin-bottom:12px; color:var(--ad-navy);">Data Absensi</h3>
                <div style="overflow:auto;">
                    <table class="admin-table">
                        <thead><tr><th>Tanggal</th><th>Nama</th><th>No. HP</th><th>Email</th><th>Pertemuan</th><th>Status</th><th>Catatan</th><th>Aksi</th></tr></thead>
                        <tbody id="att-tbody"></tbody>
                    </table>
                </div>
            </div>

            <div class="admin-section" id="section-stats">
                <h3 style="margin-bottom:12px; color:var(--ad-navy);">Statistik</h3>
                <div id="stats-cards" style="display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-bottom:20px;"></div>
                <div style="display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px;">
                    <button class="btn-xs btn-primary" id="btn-export" type="button" style="padding:8px 16px; font-size:13px;">Export Absensi (CSV)</button>
                    <button class="btn-xs btn-outline" id="btn-audit" type="button" style="padding:8px 16px; font-size:13px;">Lihat Audit Log</button>
                </div>
                <div id="audit-log" style="max-height:300px; overflow:auto; font-size:13px;"></div>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="user-modal">
        <div class="modal-card">
            <h3 id="modal-title">Tambah User</h3>
            <form id="user-form" novalidate>
                <input type="hidden" id="user-uid">
                <div class="form-group"><label for="user-name">Nama</label><input type="text" id="user-name" required></div>
                <div class="form-group"><label for="user-email">Email</label><input type="email" id="user-email" required></div>
                <div class="form-group"><label for="user-phone">No. HP</label><input type="tel" id="user-phone"></div>
                <div class="form-group"><label for="user-password">Password</label><input type="password" id="user-password" required minlength="6"></div>
                <div class="form-group"><label for="user-role">Role</label>
                    <select id="user-role"><option value="user">User</option><option value="admin">Admin</option></select>
                </div>
                <div class="form-group"><label for="user-status">Status</label>
                    <select id="user-status"><option value="pending">Pending</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
                </div>
                <div style="display:flex; gap:8px; justify-content:flex-end; margin-top:12px;">
                    <button class="btn-xs btn-outline" type="button" id="modal-cancel">Batal</button>
                    <button class="btn-xs btn-primary" type="submit">Simpan</button>
                </div>
            </form>
        </div>
    </div>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script>
    (function () {
      // Override auth.js navbar injection: admin panel has its own topbar, so remove injected nav items
      var _origUpdate = window.ALAuth && window.ALAuth.updateNavbar;
      // We'll just hide any .nav-auth after init
      function cleanNav() {
        document.querySelectorAll(".nav-auth").forEach(function (el) { el.remove(); });
        var nav = document.getElementById("nav-menu");
        if (nav) nav.style.display = "none";
      }

      var usersTbody = document.getElementById("users-tbody");
      var attTbody = document.getElementById("att-tbody");
      var statusEl = document.getElementById("admin-status");
      var modal = document.getElementById("user-modal");
      var form = document.getElementById("user-form");

      function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
      function badge(status){
        var cls = status === "approved" ? "status-approved" : (status === "rejected" ? "status-rejected" : "status-pending");
        return '<span class="status-badge '+cls+'">'+escapeHtml(status||"-")+'</span>';
      }

      async function logAudit(action, target) {
        try {
          await window.ALAuth.db.collection("audit").add({
            actor: (window.ALAuth.userDoc && window.ALAuth.userDoc.email) || "admin",
            action: action,
            target: target,
            createdAt: new Date().toISOString()
          });
        } catch (e) { console.warn("Audit log gagal:", e); }
      }

      async function ensureAdmin() {
        if (!window.ALAuth) return false;
        if (!window.ALAuth.ready) {
          await new Promise(function(res){ var t=setInterval(function(){ if(window.ALAuth.ready){ clearInterval(t); res(); } },200); });
        }
        if (!window.ALAuth.currentUser) { window.location.replace("login.html"); return false; }
        if (!window.ALAuth.isAdmin) { window.location.replace("index.html"); return false; }
        return true;
      }

      var isLoadingUsers = false;
      async function loadUsers() {
        if (isLoadingUsers) return;
        if (!await ensureAdmin()) return;
        isLoadingUsers = true;
        statusEl.textContent = "Memuat user...";
        usersTbody.innerHTML = "";
        try {
          var snap = await window.ALAuth.db.collection("users").get();
          if (snap.empty) { statusEl.textContent = "Belum ada user."; return; }
          statusEl.textContent = "Total user: " + snap.size;
          snap.forEach(function (doc) {
            var u = doc.data(); u.uid = doc.id;
            var tr = document.createElement("tr");
            tr.innerHTML =
              "<td>"+escapeHtml(u.name||"-")+"</td>" +
              "<td>"+escapeHtml(u.email||"-")+"</td>" +
              "<td>"+escapeHtml(u.phone||"-")+"</td>" +
              "<td>"+escapeHtml(u.role||"-")+"</td>" +
              "<td>"+badge(u.status)+"</td>" +
              "<td><div class='admin-actions'>" +
                (u.status !== "approved" ? '<button class="btn-xs btn-primary" data-act="approve" data-uid="'+u.uid+'">Setujui</button>' : '') +
                (u.status !== "rejected" ? '<button class="btn-xs btn-outline" data-act="reject" data-uid="'+u.uid+'">Tolak</button>' : '') +
                '<button class="btn-xs btn-outline" data-act="edit" data-uid="'+u.uid+'">Edit</button>' +
                '<button class="btn-xs btn-danger" data-act="delete" data-uid="'+u.uid+'">Hapus</button>' +
              "</div></td>";
            usersTbody.appendChild(tr);
          });
        } catch (e) { statusEl.textContent = "Gagal memuat user: " + (e.message || e); }
        finally { isLoadingUsers = false; }
      }

      var isLoadingAtt = false;
      async function loadAttendance() {
        if (isLoadingAtt) return;
        if (!await ensureAdmin()) return;
        isLoadingAtt = true;
        attTbody.innerHTML = "";
        try {
          var snap = await window.ALAuth.db.collection("attendance").get();
          if (snap.empty) { attTbody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:var(--ad-muted);'>Belum ada data absensi.</td></tr>"; return; }
          snap.forEach(function (doc) {
            var a = doc.data(); a.id = doc.id;
            var tr = document.createElement("tr");
            tr.innerHTML =
              "<td>"+escapeHtml(a.tanggal||"-")+"</td>" +
              "<td>"+escapeHtml(a.name||"-")+"</td>" +
              "<td>"+escapeHtml(a.phone||"-")+"</td>" +
              "<td>"+escapeHtml(a.email||a.uid||"-")+"</td>" +
              "<td>"+escapeHtml(a.idAbsen||"-")+"</td>" +
              "<td>"+escapeHtml(a.status||"-")+"</td>" +
              "<td>"+escapeHtml(a.note||"-")+"</td>" +
              "<td><button class='btn-xs btn-danger' data-act='delatt' data-id='"+a.id+"'>Hapus</button></td>";
            attTbody.appendChild(tr);
          });
        } catch (e) { attTbody.innerHTML = "<tr><td colspan='6'>Gagal memuat: "+escapeHtml(e.message||e)+"</td></tr>"; }
        finally { isLoadingAtt = false; }
      }

      usersTbody.addEventListener("click", async function (e) {
        var btn = e.target.closest("button[data-act]");
        if (!btn) return;
        var uid = btn.getAttribute("data-uid");
        var act = btn.getAttribute("data-act");
        try {
          if (act === "approve") { await window.ALAuth.db.collection("users").doc(uid).update({ status: "approved" }); await logAudit("APPROVE_USER", uid); }
          else if (act === "reject") { await window.ALAuth.db.collection("users").doc(uid).update({ status: "rejected" }); await logAudit("REJECT_USER", uid); }
          else if (act === "delete") { if (!confirm("Hapus user ini?")) return; await window.ALAuth.db.collection("users").doc(uid).delete(); await logAudit("DELETE_USER", uid); }
          else if (act === "edit") { await openEditUser(uid); return; }
          await loadUsers();
        } catch (err) { alert("Gagal: " + (err.message || err)); }
      });

      attTbody.addEventListener("click", async function (e) {
        var btn = e.target.closest("button[data-act='delatt']");
        if (!btn) return;
        var id = btn.getAttribute("data-id");
        if (!confirm("Hapus data absensi ini?")) return;
        try { await window.ALAuth.db.collection("attendance").doc(id).delete(); await logAudit("DELETE_ATTENDANCE", id); await loadAttendance(); }
        catch (err) { alert("Gagal: " + (err.message || err)); }
      });

      document.getElementById("tab-users").addEventListener("click", function () {
        document.getElementById("section-users").classList.add("active");
        document.getElementById("section-attendance").classList.remove("active");
        this.classList.add("active");
        document.getElementById("tab-attendance").classList.remove("active");
        loadUsers();
      });
      document.getElementById("tab-attendance").addEventListener("click", function () {
        document.getElementById("section-attendance").classList.add("active");
        document.getElementById("section-users").classList.remove("active");
        document.getElementById("section-stats").classList.remove("active");
        document.getElementById("tab-users").classList.remove("active");
        document.getElementById("tab-stats").classList.remove("active");
        this.classList.add("active");
        loadAttendance();
      });

      document.getElementById("tab-stats").addEventListener("click", function () {
        document.getElementById("section-stats").classList.add("active");
        document.getElementById("section-users").classList.remove("active");
        document.getElementById("section-attendance").classList.remove("active");
        document.getElementById("tab-users").classList.remove("active");
        document.getElementById("tab-attendance").classList.remove("active");
        this.classList.add("active");
        loadStats();
      });

      document.getElementById("tab-users").addEventListener("click", function () {
        document.getElementById("section-users").classList.add("active");
        document.getElementById("section-attendance").classList.remove("active");
        document.getElementById("section-stats").classList.remove("active");
        document.getElementById("tab-attendance").classList.remove("active");
        document.getElementById("tab-stats").classList.remove("active");
        this.classList.add("active");
        loadUsers();
      });

      async function loadStats() {
        if (!await ensureAdmin()) return;
        try {
          var usnap = await window.ALAuth.db.collection("users").get();
          var asnap = await window.ALAuth.db.collection("attendance").get();
          var users = 0, pending = 0, approved = 0, attendance = 0, hadir = 0;
          usnap.forEach(function (d) { var u = d.data(); users++; if (u.status === "pending") pending++; if (u.status === "approved") approved++; });
          asnap.forEach(function (d) { var a = d.data(); attendance++; if (a.status === "Hadir") hadir++; });
          var cards = document.getElementById("stats-cards");
          cards.innerHTML = "";
          var items = [
            { label: "Total User", val: users },
            { label: "Pending", val: pending },
            { label: "Approved", val: approved },
            { label: "Total Absensi", val: attendance },
            { label: "Hadir", val: hadir }
          ];
          items.forEach(function (it) {
            var d = document.createElement("div");
            d.style.background = "#fff";
            d.style.border = "1px solid var(--ad-line)";
            d.style.borderRadius = "10px";
            d.style.padding = "14px";
            d.style.textAlign = "center";
            d.innerHTML = "<div style='font-size:24px; font-weight:800; color:var(--ad-blue);'>" + it.val + "</div><div style='font-size:12.5px; color:var(--ad-muted);'>" + it.label + "</div>";
            cards.appendChild(d);
          });
        } catch (e) { document.getElementById("stats-cards").innerHTML = "Gagal: " + (e.message || e); }
      }

      document.getElementById("btn-export").addEventListener("click", async function () {
        try {
          var snap = await window.ALAuth.db.collection("attendance").get();
          var rows = [];
          snap.forEach(function (doc) { rows.push(doc.data()); });
          var csv = "Tanggal,Nama,No HP,Email,Pertemuan,Status,Catatan,CreatedAt\n";
          rows.forEach(function (a) {
            csv += '"' + (a.tanggal||"") + '","' + (a.name||"") + '","' + (a.phone||"") + '","' + (a.email||"") + '","' + (a.idAbsen||"") + '","' + (a.status||"") + '","' + (a.note||"") + '","' + (a.createdAt||"") + '"\n';
          });
          var blob = new Blob([csv], { type: "text/csv" });
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url;
          a.download = "absensi.csv";
          a.click();
          URL.revokeObjectURL(url);
        } catch (e) { alert("Gagal export: " + (e.message || e)); }
      });

      document.getElementById("btn-audit").addEventListener("click", async function () {
        try {
          var snap = await window.ALAuth.db.collection("audit").get();
          var rows = [];
          snap.forEach(function (d) { var dd = d.data(); if (dd.action === "TEST" && dd.actor === "test") return; rows.push(dd); });
          rows.sort(function (a, b) { return (b.createdAt||"") > (a.createdAt||"") ? 1 : -1; });
          var html = "<table class='admin-table'><thead><tr><th>Waktu</th><th>Aktor</th><th>Aksi</th><th>Target</th></tr></thead><tbody>";
          if (rows.length === 0) html += "<tr><td colspan='4' style='text-align:center; color:var(--ad-muted);'>Belum ada audit log.</td></tr>";
          rows.forEach(function (a) {
            html += "<tr><td>"+(a.createdAt||"-")+"</td><td>"+(a.actor||"-")+"</td><td>"+(a.action||"-")+"</td><td>"+(a.target||"-")+"</td></tr>";
          });
          html += "</tbody></table>";
          document.getElementById("audit-log").innerHTML = html;
        } catch (e) { document.getElementById("audit-log").innerHTML = "Gagal: " + (e.message || e); }
      });

      var modal = document.getElementById("user-modal");
      var form = document.getElementById("user-form");
      function openModal(data) {
        document.getElementById("modal-title").textContent = data ? "Edit User" : "Tambah User";
        document.getElementById("user-uid").value = data ? data.uid : "";
        document.getElementById("user-name").value = data ? (data.name || "") : "";
        document.getElementById("user-email").value = data ? (data.email || "") : "";
        document.getElementById("user-phone").value = data ? (data.phone || "") : "";
        document.getElementById("user-password").value = data ? (data.password || "") : "";
        document.getElementById("user-role").value = data ? (data.role || "user") : "user";
        document.getElementById("user-status").value = data ? (data.status || "pending") : "pending";
        modal.classList.add("open");
      }
      function closeModal() { modal.classList.remove("open"); form.reset(); }
      document.getElementById("modal-cancel").addEventListener("click", closeModal);
      modal.addEventListener("click", function (e) { if (e.target === modal) closeModal(); });

      async function openEditUser(uid) {
        try {
          var snap = await window.ALAuth.db.collection("users").doc(uid).get();
          if (!snap.exists) { alert("User tidak ditemukan."); return; }
          var data = snap.data(); data.uid = uid;
          openModal(data);
        } catch (e) { alert("Gagal: " + (e.message || e)); }
      }

      document.getElementById("btn-add-user").addEventListener("click", function () { openModal(null); });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        var uid = document.getElementById("user-uid").value;
        var data = {
          name: document.getElementById("user-name").value.trim(),
          email: document.getElementById("user-email").value.trim(),
          phone: document.getElementById("user-phone").value.trim(),
          password: document.getElementById("user-password").value,
          role: document.getElementById("user-role").value,
          status: document.getElementById("user-status").value
        };
        try {
          if (uid) {
            await window.ALAuth.db.collection("users").doc(uid).update(data);
            await logAudit("UPDATE_USER", uid);
          } else {
            var newUid = "u_" + Math.random().toString(36).slice(2, 9);
            data.uid = newUid;
            data.createdAt = new Date().toISOString();
            await window.ALAuth.db.collection("users").doc(newUid).set(data);
            await logAudit("CREATE_USER", newUid);
          }
          closeModal();
          await loadUsers();
        } catch (err) { alert("Gagal menyimpan: " + (err.message || err)); }
      });

      document.getElementById("admin-logout").addEventListener("click", function () {
        if (window.ALAuth && window.ALAuth.logout) window.ALAuth.logout();
        else window.location.href = "index.html";
      });

      // init
      (async function () {
        // tunggu auth
        if (!window.ALAuth.ready) {
          await new Promise(function(res){ var t=setInterval(function(){ if(window.ALAuth.ready){ clearInterval(t); res(); } },200); });
        }
        cleanNav();
        if (!await ensureAdmin()) return;
        await loadUsers();
        window.ALAuth.onAuthChanged = function () { loadUsers(); };
      })();
    })();
    </script>
</body>
</html>

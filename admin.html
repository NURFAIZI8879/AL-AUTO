<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel Admin — AL AUTO</title>
    <meta name="theme-color" content="#002b5e">
    <link rel="icon" type="image/png" href="assets/img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/global.css" rel="stylesheet">
</head>
<body class="absen">
    <header class="navbar">
        <div class="navbar-inner">
            <a class="brand" href="index.html">
                <span class="brand-logo"><img src="assets/img/logo.png" alt="Logo AL AUTO"></span>
                <span class="brand-text">AL AUTO<small>Kursus Mengemudi</small></span>
            </a>
            <button class="nav-toggle" type="button" aria-label="Buka menu navigasi" aria-expanded="false" aria-controls="nav-menu">
                <span></span><span></span><span></span>
            </button>
            <ul class="navbar-nav" id="nav-menu">
                <li class="nav-item"><a class="nav-link" href="index.html">Beranda</a></li>
                <li class="nav-item"><a class="nav-link" href="absensi.html">Absensi</a></li>
                <li class="nav-item daftar"><a class="nav-link" href="login.html">Login</a></li>
            </ul>
        </div>
    </header>

    <main class="page">
        <section class="page-head">
            <div class="container">
                <span class="hero-eyebrow">Admin</span>
                <h1>Panel Admin — Verifikasi User</h1>
                <p>Setujui atau tolak pendaftaran user sebelum fitur absensi aktif.</p>
            </div>
        </section>

        <section class="form-section">
            <div class="container">
                <div class="absen-wrap fade-in">
                    <div class="form-card">
                        <h2>Daftar User Pending</h2>
                        <p class="form-subtitle" id="admin-status">Memuat...</p>
                        <div id="admin-list"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <div class="container footer-bottom-inner">
                    <span>&copy; <span data-year>2026</span> AL AUTO. Seluruh hak cipta dilindungi.</span>
                </div>
            </div>
        </div>
    </footer>

    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/auth.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
    (function () {
      var listEl = document.getElementById("admin-list");
      var statusEl = document.getElementById("admin-status");

      function renderUser(u) {
        var div = document.createElement("div");
        div.style.border = "1px solid var(--line)";
        div.style.borderRadius = "10px";
        div.style.padding = "12px";
        div.style.marginBottom = "10px";
        div.innerHTML =
          "<strong>" + escapeHtml(u.name || "-") + "</strong><br>" +
          "Email: " + escapeHtml(u.email || "-") + "<br>" +
          "HP: " + escapeHtml(u.phone || "-") + "<br>" +
          "Status: " + escapeHtml(u.status || "-") +
          (u.status === "pending"
            ? '<div style="margin-top:8px; display:flex; gap:8px;">' +
              '<button class="btn btn-navy btn-sm" data-action="approve" data-uid="' + u.uid + '">Setujui</button>' +
              '<button class="btn btn-outline btn-sm" data-action="reject" data-uid="' + u.uid + '" style="color:var(--navy); border-color:var(--line);">Tolak</button>' +
              '</div>'
            : "");
        return div;
      }

      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }

      async function loadUsers() {
        if (!window.ALAuth || !window.ALAuth.ready) {
          statusEl.textContent = "Firebase belum dikonfigurasi.";
          return;
        }
        // tunggu auth state
        var user = window.ALAuth.currentUser;
        if (!user) {
          statusEl.textContent = "Silakan login terlebih dahulu.";
          return;
        }
        if (!window.ALAuth.isAdmin) {
          statusEl.textContent = "Akses ditolak. Hanya admin yang boleh membuka panel ini.";
          return;
        }
        statusEl.textContent = "Memuat daftar user...";
        listEl.innerHTML = "";
        try {
          var snap = await window.ALAuth.db.collection("users").orderBy("createdAt", "desc").get();
          if (snap.empty) {
            statusEl.textContent = "Belum ada user terdaftar.";
            return;
          }
          statusEl.textContent = "Total user: " + snap.size;
          snap.forEach(function (doc) {
            var data = doc.data();
            data.uid = doc.id;
            listEl.appendChild(renderUser(data));
          });
        } catch (e) {
          statusEl.textContent = "Gagal memuat: " + (e.message || e);
        }
      }

      document.addEventListener("click", async function (e) {
        var btn = e.target.closest("button[data-action]");
        if (!btn) return;
        var uid = btn.getAttribute("data-uid");
        var action = btn.getAttribute("data-action");
        if (!window.ALAuth || !window.ALAuth.ready) return;
        try {
          var newStatus = action === "approve" ? "approved" : "rejected";
          await window.ALAuth.db.collection("users").doc(uid).update({ status: newStatus });
          await loadUsers();
        } catch (err) {
          alert("Gagal: " + (err.message || err));
        }
      });

      // tunggu auth init
      var check = setInterval(function () {
        if (window.ALAuth && window.ALAuth.ready !== undefined && (window.ALAuth.ready || !window.ALAuth.configured)) {
          clearInterval(check);
          // kalau auth state belum siap, tunggu sedikit
          setTimeout(loadUsers, 500);
        }
      }, 200);

      window.ALAuth.onAuthChanged = function () { setTimeout(loadUsers, 300); };
    })();
    </script>
</body>
</html>
